# ─────────────────────────────────────────────────────────────────
# sources.yaml — Configuración de descubrimiento por plataforma y por país
#
# YouTube:   búsqueda por consultas (ytsearch) + raspado de subidas de canales
# Facebook:  listados /videos/ de páginas — requests + respaldo con Playwright
# Otras:     URLs de cuentas — yt-dlp extrae de forma plana la lista de videos
# ─────────────────────────────────────────────────────────────────

youtube:
  peru:
    channels:
      # Verificado con yt-dlp en 2026-07: los handles que daban 404 se
      # reemplazaron por el handle/ID de canal vigente, o se descartaron si no
      # se encontró un canal activo (ver comentarios más abajo).
      - "https://www.youtube.com/@policiaperu/videos"                          # antes @PoliciaOfPeru (404)
      - "https://www.youtube.com/@munidemiraflores/videos"                     # antes @SerenazgodeMiraflores (404) — canal municipal, no específico de Serenazgo
      - "https://www.youtube.com/@MunicipalidadDeLima/videos"
      - "https://www.youtube.com/channel/UC91qATrOkn7FLB4AfCboKhg/videos"      # antes @FiscaliadeLaNacion (404) — Ministerio Público, sin @handle
      - "https://www.youtube.com/channel/UCvCLoltBg5y32b0oBG8j0EQ/videos"      # antes @PJudicialdePeru (404) — Poder Judicial del Perú, sin @handle
      - "https://www.youtube.com/channel/UCPhm2I2wk4vqjENwhn3px8A/videos"      # antes @AmericaNoticias (404) — sin @handle
      # @CanalNPeru (404) descartado: no se encontró un canal de YouTube activo
      # de Canal N a 2026-07 (canaln.pe tampoco enlaza uno).
      - "https://www.youtube.com/@ATVnoticias/videos"
      - "https://www.youtube.com/@RPPNoticias/videos"
      - "https://www.youtube.com/@panamericanatelevision/videos"              # antes @panamericanatv (404)
      - "https://www.youtube.com/@tvperunoticias/videos"
      - "https://www.youtube.com/@larepublicanoticias/videos"                 # antes @LaRepublicaPe (404)
      - "https://www.youtube.com/@DiarioElComercio/videos"                    # antes @ElComercioPeruTV (404)
      - "https://www.youtube.com/tromepe/videos"                              # antes @TromeOficial (404)
      - "https://www.youtube.com/channel/UClBYe6QzTvvd32trO3S7Fug/videos"     # antes @SISEDAT (404) — canal real, sin @handle; publica contenido de "Robos captados por cámaras de seguridad", pertinente
      # @AlertasLima (404) descartado: el único canal activo con ese nombre es
      # un instalador comercial de equipos CCTV (demos de producto), no una
      # fuente de contenido de seguridad ciudadana.
      # @OjoEnAccionPeru (404) descartado: no se encontró un canal de YouTube activo.
